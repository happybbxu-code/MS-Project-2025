<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Screening Assistant</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #eef2f7;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  /* iOS safe-area: keep content clear of the notch and home indicator */
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ---- Header ---- */
header {
  background: linear-gradient(135deg, #1a56db 0%, #1e40af 100%);
  color: white;
  padding: 14px 20px;
  padding-top: calc(14px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 12px rgba(26,86,219,0.3);
  flex-shrink: 0;
  min-width: 0;
}
.avatar {
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
header .title {
  flex: 1;
  min-width: 0; /* allow the title block to shrink so the header never overflows */
}
header h1 {
  font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
header p  { font-size: 12px; opacity: 0.75; margin-top: 1px; }
.badge {
  margin-left: auto;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  white-space: nowrap;
  flex-shrink: 0;
}
/* On narrow phones: hide the decorative badge and avatar, and collapse the
   restart button to an icon, so the full title fits without ellipsis. */
@media (max-width: 480px) {
  .badge { display: none; }
  .avatar { display: none; }
  .restart-label { display: none; }
  header { padding: 12px 14px; gap: 10px; }
  header h1 { font-size: 15px; }
}

/* ---- Chat area ---- */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}

.row { display: flex; align-items: flex-end; gap: 8px; }
.row.doctor  { justify-content: flex-start; }
.row.patient { justify-content: flex-end; }

.icon {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.row.doctor  .icon { background: #dbeafe; }
.row.patient .icon { display: none; }

.bubble {
  max-width: min(68%, 480px);
  padding: 11px 15px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.55;
  word-break: break-word;
}
.row.doctor  .bubble {
  background: white;
  color: #1e293b;
  border-radius: 4px 18px 18px 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.row.patient .bubble {
  background: #1a56db;
  color: white;
  border-radius: 18px 18px 4px 18px;
}

/* typing indicator */
.typing-dots {
  display: flex; gap: 5px;
  padding: 14px 18px;
  background: white;
  border-radius: 4px 18px 18px 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  width: fit-content;
}
.typing-dots span {
  width: 7px; height: 7px;
  background: #94a3b8; border-radius: 50%;
  animation: bop 1.3s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.18s; }
.typing-dots span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bop {
  0%, 60%, 100% { transform: translateY(0); }
  30%           { transform: translateY(-7px); background: #64748b; }
}

/* ---- Input bar ---- */
#bar {
  background: white;
  border-top: 1px solid #e2e8f0;
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
}
#txt {
  flex: 1;
  border: 1.5px solid #e2e8f0;
  border-radius: 22px;
  padding: 9px 16px;
  font-size: 14.5px;
  outline: none;
  transition: border-color 0.18s;
  resize: none;
  line-height: 1.4;
  max-height: 90px;
  font-family: inherit;
}
#txt:focus { border-color: #1a56db; }
#txt:disabled { background: #f8fafc; }
#btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: #1a56db; color: white; border: none;
  cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.18s, transform 0.1s;
  flex-shrink: 0;
}
#btn:hover:not(:disabled) { background: #1447c0; transform: scale(1.05); }
#btn:disabled { background: #cbd5e1; cursor: default; }

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #94a3b8;
  padding: 4px 0 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}

/* ---- Screening card ---- */
.screening-card {
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  border: 1.5px solid #86efac;
  border-radius: 14px;
  padding: 14px 16px;
  margin-top: 4px;
}
.screening-card .label {
  font-size: 11px; font-weight: 600;
  color: #16a34a; text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.screening-card .disease {
  font-size: 20px; font-weight: 700; color: #15803d;
  text-transform: capitalize;
}
.screening-card .symptoms {
  margin-top: 8px; font-size: 12.5px; color: #166534;
}
.screening-card .symptoms span {
  display: inline-block;
  background: rgba(22,101,52,0.1);
  border-radius: 10px;
  padding: 2px 8px; margin: 2px 3px 2px 0;
}
</style>
</head>
<body>

<header>
  <div class="avatar">⚕️</div>
  <div class="title">
    <h1>Medical Screening Assistant</h1>
    <p>Conversational AI · Local AI-assisted screening</p>
  </div>
  <div class="badge">🔒 AI-assisted screening</div>
  <button id="restart-btn" title="Restart conversation" aria-label="Restart conversation"
    style="margin-left:10px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;">
    <span class="restart-icon">&#8635;</span><span class="restart-label"> Restart</span>
  </button>
</header>

<div id="chat"></div>

<div id="new-chat-bar" style="display:none; justify-content:center; padding:14px 16px; background:white; border-top:1px solid #e2e8f0;">
  <button id="new-chat-btn"
    style="background:#1a56db;color:white;border:none;border-radius:22px;padding:11px 28px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">
    &#43; Start New Chat
  </button>
</div>
<div id="bar">
  <textarea id="txt" rows="1"
    placeholder="Describe your symptoms…"
    disabled></textarea>
  <button id="btn" disabled title="Send">&#9658;</button>
</div>
<div class="disclaimer">Not a substitute for professional medical advice.</div>

<script>
const chatEl      = document.getElementById('chat');
const txtEl       = document.getElementById('txt');
const btnEl       = document.getElementById('btn');
const newChatBar  = document.getElementById('new-chat-bar');
const newChatBtn  = document.getElementById('new-chat-btn');
const restartBtn  = document.getElementById('restart-btn');

function restartChat() {
  chatEl.innerHTML = '';
  newChatBar.style.display = 'none';
  document.getElementById('bar').style.display = 'flex';
  startSession();
}

let session = null;

/* ---- DOM helpers ---- */
function addBubble(text, role, extra) {
  const row = document.createElement('div');
  row.className = `row ${role}`;

  if (role === 'doctor') {
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = '👨‍⚕️';
    row.appendChild(icon);
  }

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;
  row.appendChild(bub);

  // Append diagnosis card if provided
  if (extra) {
    const card = document.createElement('div');
    card.className = 'screening-card';
    card.innerHTML = `
      <div class="label">Prolog rule matched</div>
      <div class="disease">${extra.disease}</div>
      <div class="symptoms">
        ${extra.matched.map(s => `<span>${s.replace(/_/g,' ')}</span>`).join('')}
      </div>`;
    bub.appendChild(card);
  }

  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row doctor';
  row.id = 'typing-row';

  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.textContent = '👨‍⚕️';

  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(icon);
  row.appendChild(dots);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

function setEnabled(on) {
  txtEl.disabled = !on;
  btnEl.disabled = !on;
  if (on) txtEl.focus();
}

/* ---- Auto-resize textarea ---- */
txtEl.addEventListener('input', () => {
  txtEl.style.height = 'auto';
  txtEl.style.height = Math.min(txtEl.scrollHeight, 90) + 'px';
});

/* ---- Send ---- */
async function send() {
  const text = txtEl.value.trim();
  if (!text || !session) return;

  txtEl.value = '';
  txtEl.style.height = 'auto';
  addBubble(text, 'patient');
  setEnabled(false);
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: session })
    });
    const data = await res.json();
    hideTyping();
    session = data.session_id;

    let extra = null;
    if (data.result && data.result.type === 'screening' && data.result.candidates.length > 0) {
      // Show the top candidate as the primary card
      extra = data.result.candidates[0];
    }

    addBubble(data.message, 'doctor', extra);

    if (data.done) {
      document.getElementById('bar').style.display = 'none';
      newChatBar.style.display = 'flex';
    } else {
      setEnabled(true);
    }
  } catch (err) {
    hideTyping();
    addBubble('Something went wrong. Please try again.', 'doctor');
    setEnabled(true);
  }
}

btnEl.addEventListener('click', send);
txtEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

newChatBtn.addEventListener('click', restartChat);
restartBtn.addEventListener('click', restartChat);

/* ---- Start ---- */
async function startSession() {
  showTyping();
  try {
    const res = await fetch('/start', { method: 'POST' });
    const data = await res.json();
    hideTyping();
    session = data.session_id;
    addBubble(data.message, 'doctor');
    setEnabled(true);
  } catch {
    hideTyping();
    addBubble('Could not connect to the server. Make sure app.py is running.', 'doctor');
  }
}

startSession();
</script>
</body>
</html>
